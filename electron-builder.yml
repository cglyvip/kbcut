appId: com.kbcut.app
productName: 口播智剪
copyright: Copyright © 2026 CGLY
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
# Prefer local Electron binary to avoid download hangs in CI/offline packaging
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: KBCut-${version}-win-x64-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 口播智剪
  uninstallDisplayName: 口播智剪
  deleteAppDataOnUninstall: false
asar: true
asarUnpack:
  - 'node_modules/ffmpeg-static/**'
  - 'node_modules/@ffprobe-installer/**'
  - 'node_modules/@huggingface/transformers/**'
  - 'node_modules/onnxruntime-*/**'
publish:
  provider: github
  owner: cglyvip
  repo: kbcut
  releaseType: release

