appId: com.kbcut.app
productName: 口播智剪
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
asar: true
asarUnpack:
  - 'node_modules/ffmpeg-static/**'
  - 'node_modules/@huggingface/transformers/**'
  - 'node_modules/onnxruntime-*/**'
