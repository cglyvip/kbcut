name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag and package versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          # Public open-source default: publish directly for end users
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          body: |
            ## KBCut ${{ github.ref_name }}

            Windows 10/11 x64 安装包。

            ### 适用系统
            - Windows 10 / 11
            - 64 位（x64）

            ### 不支持
            - macOS
            - Linux
            - Windows ARM

            ### 使用前准备
            - 在设置中填写大模型 API（可配置多个候补）
            - 在线识别需填写 Whisper API
            - API Key 仅保存在本机
